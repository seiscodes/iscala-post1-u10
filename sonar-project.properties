# Configuración para sonar-scanner (CLI). Con "mvn sonar:sonar" el scanner de Maven toma
# los mismos valores de las propiedades sonar.* del pom.xml.

# Identificación del proyecto en SonarQube
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Código fuente, pruebas y clases compiladas (requiere haber ejecutado mvn verify antes)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Cobertura: reporte XML que genera jacoco-maven-plugin en la fase verify
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor (SonarQube local en Docker)
sonar.host.url=http://localhost:9000

# No se espera el resultado del Quality Gate en el build; se consulta en el dashboard
sonar.qualitygate.wait=false

# Exclusiones: ninguna. Todo el código del proyecto es lógica de negocio (ver Decisión 2 del README).
